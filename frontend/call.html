<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talk to the desk &mdash; Bella Hair Studio</title>

    <!-- Marketing pages should be indexed; a live call screen should not. -->
    <meta name="robots" content="noindex" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

   
    <style type="text/tailwindcss">
      @theme {
        --color-cream: #faf6ef;
        --color-cream-deep: #f2ebdf;
        --color-espresso: #2b1d16;
        --color-espresso-soft: #3d2b21;
        --color-ink: #4a3a30;
        --color-muted: #7a6656;
        --color-tan: #b08968;
        --color-hairline: #e4dacb;
        --font-display: 'Playfair Display', Georgia, serif;
        --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
      }
    </style>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <!--
    The call screen is dark where the marketing site is cream. That is a
    deliberate mode change rather than an inconsistency: it signals "you are now
    in a call" and keeps attention on the single control, while staying inside
    the same espresso-and-tan palette so it still reads as the same brand.
  -->
  <body class="min-h-screen bg-espresso font-sans text-cream antialiased">
    <main class="mx-auto flex min-h-screen max-w-md flex-col items-center justify-center px-6 py-12">
      <!-- Always leave a way back; a dead-end page feels broken. -->
      <a
        href="index.html"
        class="absolute left-6 top-6 text-sm text-cream/50 transition hover:text-cream"
      >
        &larr; Back to the studio
      </a>

      <header class="mb-12 text-center">
        <p class="text-[0.7rem] font-medium uppercase tracking-[0.25em] text-tan">
          Bella Hair Studio
        </p>
        <h1 class="mt-3 font-display text-4xl font-medium tracking-tight text-cream">
          The front desk
        </h1>
        <p class="mx-auto mt-4 max-w-xs text-sm leading-relaxed text-cream/60">
          Tap below and just talk. Your browser will ask for microphone access.
        </p>
      </header>

      <!--
        The call button doubles as the visual state indicator. `data-state` is
        written by app.js and drives the ring animation in styles.css, which
        keeps animation logic out of JavaScript.
      -->
      <button
        id="call-button"
        type="button"
        data-state="idle"
        class="call-button relative flex h-40 w-40 items-center justify-center rounded-full bg-tan px-6 text-center text-base font-semibold leading-snug text-espresso shadow-xl shadow-black/30 transition hover:brightness-110 focus:outline-none focus-visible:ring-4 focus-visible:ring-tan/40 disabled:cursor-not-allowed disabled:opacity-60"
      >
        <span id="call-button-label">Talk to Desk</span>
      </button>

      <!--
        aria-live announces status changes to screen readers. Connection state
        is conveyed by colour and motion for sighted users, so it needs a
        non-visual equivalent.
      -->
      <p
        id="status-text"
        role="status"
        aria-live="polite"
        class="mt-10 h-6 text-center text-sm text-cream/60"
      >
        Ready when you are.
      </p>

      <!-- Hidden until app.js has something to report. -->
      <div
        id="error-box"
        hidden
        class="mt-6 w-full rounded-xl border border-tan/30 bg-black/25 px-4 py-3 text-sm text-cream/80"
      >
        <p id="error-text" class="leading-relaxed"></p>
      </div>

      <!--
        Revealed by app.js once the model's save_booking tool succeeds. A
        spoken reference number is easy to mishear, so it is shown as well.
      -->
      <div
        id="booking-box"
        hidden
        class="mt-8 w-full rounded-xl border border-tan/40 bg-tan/10 px-5 py-4 text-sm"
      >
        <p class="text-[0.7rem] font-medium uppercase tracking-[0.2em] text-tan">
          Booking confirmed
        </p>
        <p id="booking-reference" class="mt-2 font-display text-2xl text-cream"></p>
        <p id="booking-summary" class="mt-1 leading-relaxed text-cream/70"></p>
      </div>

      <footer class="mt-14 text-center text-xs text-cream/35">
        Demo &middot; Conversations are not recorded or stored.
      </footer>
    </main>

    <!--
      The model's voice is played through this element. It lives in the markup
      rather than being created in JavaScript so that the audio sink is part of
      the page contract, and so `playsinline` is present before any stream is
      attached -- iOS Safari otherwise tries to open audio in a fullscreen
      native player.
    -->
    <audio id="ai-audio" autoplay playsinline></audio>

    <script type="module" src="app.js"></script>
  </body>
</html>
